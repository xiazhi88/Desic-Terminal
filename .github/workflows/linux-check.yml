name: Linux check

# Linux 暂无官方安装包流水线（见 docs/development-guidelines.md 的 Linux 定位说明）。
# 这个轻量检查保证 main 与 PR 在 Ubuntu 上始终可编译：前端构建 + Rust workspace check。
# 系统依赖清单与 docs/getting-started.md 的 Ubuntu/Debian 一节保持一致。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    name: Ubuntu x64 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64-check

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check Rust workspace
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace
