name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            # 交叉编译：在 arm64 runner 上产出 x86_64 包。原来的 macos-15-intel 机器每次冷编译约 28 分钟，
            # 且因为 workflow 只由 tag 触发、save-if 排除了 tag，缓存永远无法写入 → 每次都是全量编译。
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
            # arm64 runner 默认没有 Rosetta，无法运行交叉编译出的 x64 包做运行时校验
            verify_packaged_sidecar: false
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        if: ${{ matrix.verify_packaged_sidecar != false }}
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          # 只有 __VERSION__ 占位会自动替换（tagName / releaseName / releaseBody 三处）；
          # releaseBody 里的其余人工正文不会跟随版本号，每次发版必须逐句核对。
          # 历史事故：v0.1.36 发版时说明文案仍是 v0.1.35 —— 本行保留作为警示。
          releaseBody: |
            ## Desic Terminal v__VERSION__

            本版是一个修复版本，解决 Windows 上主进程 CPU 长期占用 60%~97% 的问题。

            ### 修复：高 CPU 占用（任务管理器里 Desic Terminal 长期 60%~97%）
            - **现象**：主进程持续吃满约 14 个核（整机 60%~97%），机器发烫、其它程序变卡。
            - **根因**：图表高周期 K 线（5 分钟及以上）的本地聚合查询写法有缺陷。它用两次自连接取「每根 K 线的开盘价与收盘价」，SQLite 的查询计划不会把时间条件用在这两次连接上，于是退化成「每个时间桶都扫一遍该交易对的全部历史」。实测同一台机器：600 行内存数据跑 3 秒都出不来，真实数据库 150 小时窗口跑 300 秒仍无返回。
            - **为什么一直在烧**：前端每次刷新图表或切换周期都会触发这个查询；调用方 10 秒超时后放弃，但后台线程无法取消、继续把查询跑下去，每个这样的线程持续占用约 0.3~0.45 个核，每分钟新增一个，越积越多。
            - **修复**：改用单遍窗口函数聚合，一次扫描完成。同样的查询从「跑不完」降到 19~36 毫秒；同一状态下主进程占用从 60%~97% 降到 **0.15%**。
            - **顺带修好**：高周期图表的数据加载此前每次都会超时失败（实测完成率 0/7），现在 14/14 全部正常返回，5 分钟及以上周期可以正常显示。
            - 该修复对所有平台生效；上述 CPU 现象在 Windows 上报告并复现。

            ### 顺带优化
            - 行情 WebSocket 热路径原本对同一条报文完整解析 5 遍，并逐笔深拷贝成交数据；现合并为单次解析。这条路径实测只占进程 CPU 的 0.1%~10%，属清理性优化，不是本次 CPU 问题的原因。

            ### 官网与文档
            - 官网迁到 desicterminal.com；README 首屏换成演示 GIF，并新增常见问题。
            - 开发规范新增两条 K 线相关踩坑记录：聚合禁用 MIN/MAX 自连接；禁止依赖「超时放弃 + 后台线程继续跑」的读取模式。

            ### 验证情况与已知残余风险
            - **已通过**：`cargo test --lib market_ws`（19 项）、`cargo check --lib`；新聚合查询与独立参考实现逐行比对 30/30 一致（缺口数据、多交易对、未确认 K 线混杂、首尾不完整桶、120 个随机缺口 × 5m/15m/30m/60m/240m）。
            - **未完全验证**：图表新数据只在 Windows 桌面端用真实行情观察过窗口加载与 CPU，尚未逐一核对每个周期的显示细节。
            - **已知残余风险**：
              - 图表 K 线读取仍是「超时放弃 + 后台线程继续跑」的模式，若将来再出现慢查询仍会积压占核线程（已写入开发规范，待改）。
              - 存在一个偶发的启动卡死（停在启动页、界面不加载），规律尚未定位，与本版修复无关。
            - **已知限制**：macOS 版本仍为 ad-hoc 签名、未经 Apple 公证，首次打开时系统可能提示无法验证开发者。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
