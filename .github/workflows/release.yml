name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            # 交叉编译：在 arm64 runner 上产出 x86_64 包。原来的 macos-15-intel 机器每次冷编译约 28 分钟，
            # 且因为 workflow 只由 tag 触发、save-if 排除了 tag，缓存永远无法写入 → 每次都是全量编译。
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
            # arm64 runner 默认没有 Rosetta，无法运行交叉编译出的 x64 包做运行时校验
            verify_packaged_sidecar: false
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        if: ${{ matrix.verify_packaged_sidecar != false }}
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          # 只有 __VERSION__ 占位会自动替换（tagName / releaseName / releaseBody 三处）；
          # releaseBody 里的其余人工正文不会跟随版本号，每次发版必须逐句核对。
          # 历史事故：v0.1.36 发版时说明文案仍是 v0.1.35 —— 本行保留作为警示。
          releaseBody: |
            ## Desic Terminal v__VERSION__

            ### ⚠️ 破坏性变更：内置 Agent 编制精简
            - 内置 Agent 由 11 个精简为 **1 个（对手盘）**。取数、判断、出方案与执行统一由**主 Agent** 负责，不再有"数据归集 / 账户状态 / 决策提案"等独立角色参与。
            - 已启用这些专家、或使用旧默认角色集的 Profile：升级后会自动移除已下线的角色（**只移除、不会自动补回**），并在 Profile 设置里给出明确提示说明"职责已归主 Agent"。
            - 你自建的 Agent 不受影响。

            ### 新增：交易理念变成可编辑的 Skill
            - 新增 **trading-philosophy**（交易理念）——**你可以自由编辑、扩展**，系统升级不会覆盖你改过的内容；同时提供"恢复出厂理念"按钮。
            - 出厂内容新增一节「反着想」：把自己的方案当作对手的仓位来攻击、把"市场已经定价了什么"和"我不同意的部分"分开、结论必须能被证伪。
            - **desic-core-operations** 是唯一不可编辑的固定规范（系统工具、参数单位、权限与失败处理）；理念类内容一律不写死在这里。

            ### 修复：下一轮观察条件不再"一条坏、全废掉"
            - 之前：模型写错一个观察条件类型（例如写成 `price` 而不是 `price_cross`）会导致**整份计划被拒绝、一条都写不进去**，界面还显示成一串原始 JSON。
            - 现在：系统把**本 Profile 允许的条件类型与必填字段**直接告诉模型；仍写错时**只丢弃那一条并写明原因**，其余条件照常生效。
            - 到期时间填错（例如照抄了上一轮的时间）同样不再废掉整份计划，只把"到期时间"降级为"无到期"并留痕。
            - 界面：不认识的条件类型显示为"未知条件类型：xxx（未写入）"；"计划未落库"由红色「失败」改为黄色「警示」（这一轮的结论仍然有效）。

            ### 未开放：快速判定（快判）模式
            - 快判模式的实现已经入库，但**本版本不开放**（界面入口隐藏、后台不会触发）。计划在下一个版本开放。

            ### 其它
            - Profile 迁移提示、多语言预览等新增自动化回归断言，减少"改了没记、坏了不知道"的情况。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
