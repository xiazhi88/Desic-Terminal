name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            platform: macos-15-intel
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          releaseBody: |
            ## Desic Terminal v0.1.34

            ### 市场雷达
            - 新增独立的全市场研究工作台，覆盖全部 live OKX USDT 永续，提供综合、强势、异动、活跃、稳健、新上线和股票永续等排名视图。
            - 综合日线相对强度、20 日波动率、成交活跃度、趋势质量与点差，展示全市场排名、筛选范围排名、评分证据和排名变化；评分只用于研究优先级，不是交易信号。
            - 支持自然语言确定性筛选、保存方案、多标的比较、市场宽度、研究提醒、1 小时/1 日/7 日历史变化、评分变化归因及 1/5/20 日点时验证。
            - 股票永续接入 NASDAQ Trader Symbol Directory，并补充简体/繁体中文证券名称和上市交易所。

            ### AI 只读研究
            - 新增内置 `market-radar-research` Skill，以及排名、单标的证据、市场比较、宽度、排名历史、验证报告和保存筛选等 7 个只读 `radar.*` 工具。
            - 宽泛的当前市场分析会加载 Radar Skill，并先读取市场宽度和默认综合排名；实时证据与历史快照分别报告时间戳。
            - Radar 工具直接读取 SQLite 快照，不能修改筛选、提醒、策略、账户或订单；Profile 的全市场发现也不会扩大后续交易授权范围。

            ### Factors 与数据可靠性
            - Factors 重构为跨市场排名与验证引擎；普通策略研究继续由单合约 Python 策略负责择时、仓位、回测与实盘，公式表达式保留在市场雷达高级层。
            - 市场雷达历史准备改为应用级后台任务，无需打开 Radar 页面；UTC 小时快照可在小时内替换，保留 90 天，并保存原始趋势质量和 20 日波动率以精确复现筛选。
            - 修复严格 Radar DTO 被通用执行上下文污染、可选参数占位符和最新快照时间兼容问题；同时移除交易环境待检测状态的误导性旋转图标。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
