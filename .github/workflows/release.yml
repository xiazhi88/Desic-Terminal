name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            platform: macos-15-intel
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          releaseBody: |
            ## Desic Terminal v0.1.33

            ### AI Skills 与安全执行
            - 新增不可变 Skill Bundle：支持目录和 Git 来源导入、文件级 SHA-256 校验、版本快照及变更后自动撤销执行信任。
            - 可执行 Skill 使用受限 Node/Python 运行时、锁定依赖和有界 JSON 输入输出；仅交互式主 Agent 可在用户显式信任后调用 `skill.run`，后台 Profile 和子 Agent 始终禁止执行。
            - 将新闻与 Smart Money 能力整合为 `okx-market-intelligence`，将市场分析、永续风险、仓位管理和交易机会工作流整合为 `desic-trade-operations`；旧 Skill ID 会自动迁移并保留用户修改。

            ### Agent Template 与 Profile
            - Agent Template 现在聚焦名称、说明、补充指令和 Agent 编排；模型、Skills、账户、环境、关注品种和风险限制继续由 Profile 管理。
            - 排队中的 Agent Run 会冻结 Template 指令快照；自定义子 Agent 自动继承 Profile 允许的只读与预检工具，但不能下单或执行 Skill Runtime。
            - 每个 Profile 最多关注 3 个交易对，前端与后端同时校验；思考深度移除 Ultra，最高档恢复为极高（xhigh）。

            ### 交易归因与兼容性
            - 修复 OKX 条件单触发后的子订单和成交被错误标记为“用户”的问题；系统会沿父级 Algo Order 恢复 AI opportunity、Agent Run 和执行来源。
            - 启动迁移会幂等修复已有订单、成交、审计和持仓周期归因；用户与 AI 共同参与的持仓显示为“混合”，资金费不再干扰操作方判断。
            - 强化 V1 数据库启动校验顺序，损坏或不完整结构会在数据回填前失败关闭。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
