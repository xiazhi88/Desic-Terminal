name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            # 交叉编译：在 arm64 runner 上产出 x86_64 包。原来的 macos-15-intel 机器每次冷编译约 28 分钟，
            # 且因为 workflow 只由 tag 触发、save-if 排除了 tag，缓存永远无法写入 → 每次都是全量编译。
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
            # arm64 runner 默认没有 Rosetta，无法运行交叉编译出的 x64 包做运行时校验
            verify_packaged_sidecar: false
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        if: ${{ matrix.verify_packaged_sidecar != false }}
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          # 只有 __VERSION__ 占位会自动替换（tagName / releaseName / releaseBody 三处）；
          # releaseBody 里的其余人工正文不会跟随版本号，每次发版必须逐句核对。
          # 历史事故：v0.1.36 发版时说明文案仍是 v0.1.35 —— 本行保留作为警示。
          releaseBody: |
            ## Desic Terminal v__VERSION__

            本版修正"结论语言"与"应用内更新"两处长期别扭的地方，并保留上一版的限流与补数修复。

            ### 修复：界面中文，AI 结论却是英文
            - **根因**：语言规则只写在"用户消息"里，而系统提示词整段是英文（唯一一句是
              "Reply in the user's language"）。后台 Profile 运行是定时触发的，没有用户
              提问可供推断语言，模型便跟着英文系统提示词用英文作答——用户消息里那句中文
              指令被更长的英文提示词压过。
            - 现在语言规则落在**系统提示词**里，并明确声明它优先于提示词内其它语言偏好，
              同时要求工具名、记录 ID、代码标识符保持原样不翻译。后台运行与交互式会话
              一并生效。
            - 摘要标题集随语言一致：中文运行使用 `## 结论 / ## 事实与证据 / ## 冲突与缺口 /
              ## 观察条件 / ## 下一步`，其它语言统一使用英文标题集，不再出现"正文中文、
              标题英文"或反过来混排。
            - **"跟随系统"现在真正读取操作系统语言**：此前它只依赖前端写入的 resolvedLanguage，
              而该字段要等用户改过一次语言才写回，系统语言不在支持列表内也只能取默认值——
              于是中文系统按英文作答。现在按"系统语言 → 前端记录 → 英文"两级回退，
              显式选择的语言仍然优先。

            ### 修复：应用内更新偶发失败后只能自己重试
            - 现象：点"立即更新"偶发报 `error sending request for url (.../releases/assets/...)`，
              再点一次就成功。
            - 原因：安装包的下载是两跳——`api.github.com` 先 302 到
              `release-assets.githubusercontent.com`，任一跳瞬断就整轮失败；而原实现**没有重试**，
              一次抖动就变成红色错误卡。
            - 现在失败会自动重试（最多 3 次，间隔 1s / 3s），且**只重试传输层错误与 5xx**；
              签名校验失败、404、环境不支持等重试也无法修复的错误仍然立即失败，不掩盖真实故障。
            - 若重试后仍失败，提示会说明"已自动重试 3 次"、指出常见原因是到 GitHub 的链路或
              代理未放行 `release-assets.githubusercontent.com`，并附上该版本的手动下载页。

            ### 上一版（v0.2.1）已包含的修复
            - 启动时的 "database is locked" 竞态改为仅对"对端持锁"自动重试；权限错误、
              库损坏等真实故障仍立即提示。
            - 历史补数按端点族限制发送节奏（归档 400ms / 查询 200ms / 其余 250ms），
              统一三处不一致的 OKX 限流判断（含 `Retry-After`），并拆成"启动浅层阶段 +
              后台归档阶段"，首屏不再等待归档端点。
            - 连接看板延迟不再把"数据年龄"与"快照年龄"相加（曾把 8.7 秒积压显示成 28.7 秒），
              "行情 / 成交"按通道分别读数并新增本地排队耗时。
            - AI 配置的 Provider 改为协议导向的下拉（默认 6 项常用，可展开全部 50 项）。

            ### 验证情况与已知残余风险
            - 本次通过 `cargo test --lib` 604 项、`cargo check --workspace` 与 `npm run build`；
              新增用例覆盖语言规则与标题集的一致性（含"跟随系统"的两级回退）、
              更新失败的重试分类与失败文案。
            - OKX 限流的间隔依据官方文档取值，**仍未在真实网络校准**：公共端点额度按 IP 计，
              实测走的是共享代理出口，测不到私有端点按 User ID 的额度。
              启动日志 `%LOCALAPPDATA%\com.desic.terminal\logs\boot.log` 里的
              `private history interactive phase pacing: requests=8/8 paced_waits=0` 可判断是否被限流。
            - 语言规则现在会覆盖用户自定义 systemPrompt 中的语言要求；如需"界面中文但某个
              Profile 强制英文"，当前版本还不支持按 Profile 指定语言。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
