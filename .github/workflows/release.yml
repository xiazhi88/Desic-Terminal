name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            # 交叉编译：在 arm64 runner 上产出 x86_64 包。原来的 macos-15-intel 机器每次冷编译约 28 分钟，
            # 且因为 workflow 只由 tag 触发、save-if 排除了 tag，缓存永远无法写入 → 每次都是全量编译。
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
            # arm64 runner 默认没有 Rosetta，无法运行交叉编译出的 x64 包做运行时校验
            verify_packaged_sidecar: false
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        if: ${{ matrix.verify_packaged_sidecar != false }}
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          # 只有 __VERSION__ 占位会自动替换（tagName / releaseName / releaseBody 三处）；
          # releaseBody 里的其余人工正文不会跟随版本号，每次发版必须逐句核对。
          # 历史事故：v0.1.36 发版时说明文案仍是 v0.1.35 —— 本行保留作为警示。
          releaseBody: |
            ## Desic Terminal v__VERSION__

            本版集中在"启动不再报错、等待不再虚高、配置不再靠记忆"三类问题上。

            ### 修复：全新安装启动时的数据库锁与限流报错
            - **保存 OKX 账号后立刻报 "database is locked"**：这是启动迁移/播种与前端触发
              的历史补数抢写锁。现在仅对"对端持锁"自动重试（2s→4s，共 3 次），
              权限错误、库损坏等真实故障仍立即提示，不再被静默重试。
            - **历史补数触发 OKX 限流（50011 Too Many Requests）**：账单归档端点文档限
              5 次/2 秒，而补数原本连续打 6 个端点、每页之间没有任何间隔。现在私有 REST
              按端点族限制发送节奏（归档 400ms / 查询 200ms / 其余 250ms），
              并统一了三处此前互相不一致的限流判断（含 HTTP `Retry-After` 支持）。
            - **补数不再让首屏等待**：拆成两阶段——先取界面立刻要用的订单/成交/持仓，
              归档端点随后在后台补齐；归档阶段不只在手动同步时补跑，定时同步发现
              归档仍不完整也会补跑，不会出现"缺少补数接口"长期不消失。
            - **通知不再显示原始 JSON**：错误信息改为可读原因与建议，可自愈的错误
              降级为"后台任务稍后重试"的警示，不再一次失败连出三张红色错误卡。
            - **合约缓存读到半截文件导致的 "EOF while parsing"** 现在按缓存未命中处理
              并自动重新拉取，不再作为错误抛出。
            - 需要你留意：启动日志（`%LOCALAPPDATA%\com.desic.terminal\logs\boot.log`）
              新增了同步的请求数与限流等待统计，形如
              `private history interactive phase pacing: requests=8/8 paced_waits=0 ...`。
              `paced_waits=0` 表示确实没有被限流；如果持续出现 50011，说明这台网络的
              节奏还需要放宽，可据此反馈。

            ### 修复：连接看板的延迟数字虚高
            - 看板把"数据年龄"和"快照年龄"两个都表示延迟的值**相加**，实测把 8.7 秒
              的积压显示成 28.7 秒。现在取两者较大值，不再重复计算。
            - "行情 / 成交"这一行原本取整帧所有通道时间戳的最大值，稀疏的成交/资金费
              会把数字顶高。现在按通道分别读数：主数字只反映 ticker，成交延迟与
              **本地排队耗时**作为副行显示——后者用于区分"OKX 推得晚"和"本机处理得慢"。

            ### 改进：AI 配置的 Provider 不再是需要背下来的标识符
            - 自定义模型的 **Provider 改为下拉**：默认只列 6 个常用项并直接标注协议
              （OpenAI 兼容 / OpenAI Responses / Anthropic Messages / Gemini 等），
              「展开全部」才显示完整 50 项内置 Provider，也保留手填未列出标识的入口。
            - Provider 决定的是协议而不是厂商名：写成 `deepseek` 去连一个 OpenAI 兼容
              中转会直接报错，现在的下拉把这件事直接标在选项上。

            ### 验证情况与已知残余风险
            - 本次改动通过 `cargo test --lib` 598 项、`cargo check --workspace` 与
              `npm run build`；新增单测覆盖限流判定与退避边界、两阶段端点集合完整性、
              阶段 A 请求上限、Provider 目录与已安装 SDK 的一致性。
            - 限流的具体间隔（归档 400ms 等）依据 OKX 官方文档取值，**未能在真实网络
              上校准**：公共端点额度按 IP 计，而实测走的是共享代理出口，测不到私有端点
              按 User ID 的额度。若启动日志显示限流仍在发生，请把 boot.log 对应行反馈。
            - 本轮未在真实 Windows 桌面端跑过完整启动，首屏耗时是按请求数与间隔推算的。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
