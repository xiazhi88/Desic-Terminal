name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            # 交叉编译：在 arm64 runner 上产出 x86_64 包。原来的 macos-15-intel 机器每次冷编译约 28 分钟，
            # 且因为 workflow 只由 tag 触发、save-if 排除了 tag，缓存永远无法写入 → 每次都是全量编译。
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
            # arm64 runner 默认没有 Rosetta，无法运行交叉编译出的 x64 包做运行时校验
            verify_packaged_sidecar: false
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        if: ${{ matrix.verify_packaged_sidecar != false }}
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          # 每次发版必须同步更新本段：releaseBody 不会自动跟随版本号。
          # 历史问题：v0.1.36 发版时此处仍为 v0.1.35 文案，导致该 Release 说明与产物不符。
          # 每次发版必须同步更新本段：releaseBody 不会自动跟随版本号。
          # 历史问题：v0.1.36 发版时此处仍为 v0.1.35 文案，导致该 Release 说明与产物不符。
          # 每次发版必须同步更新本段：releaseBody 不会自动跟随版本号。
          # 每次发版必须同步更新本段：releaseBody 不会自动跟随版本号。
          releaseBody: |
            ## Desic Terminal v0.1.40

            ### 数据目录可更换（Windows；不再强制放在 C 盘）
            - 启动顺序改为「先开启动页 → 确认数据位置 → 再初始化运行目录与数据库」：**全新安装时在你确认之前不会写入任何数据**，可在启动页选择默认位置或指定其他盘符/路径（校验绝对路径、可创建、可写）。
            - 已存在数据的用户**不会被询问**：检测到数据库或配置即沿用当前位置直接启动。
            - 数据根记录在固定位置的 `data-dir.json`（不随数据迁移），自定义目录下布局与默认一致：`config` / `cache` / `logs` / `data`（数据库与 AI workspace 在 `data` 下）。数据库、更新前备份、日志目录全部改为按运行时目录解析。
            - 该能力**仅在 Windows 提供**：macOS 始终使用系统默认位置，设置页不显示该区块，后端也会忽略任何自定义目录标记。

            ### 数据目录迁移（已有数据也能换位置）
            - 设置页新增「数据目录」区：显示当前位置、各子目录占用与合计，并提供「更改数据目录…」；确认后提示重启，重启时进入迁移向导。
            - 迁移在数据库打开之前进行，按类别逐项复制并显示进度（阶段、已复制文件数、当前文件、百分比），支持取消；完成后做完整性校验（文件数量/大小 + 数据库 `PRAGMA quick_check`），**只有校验通过才切换数据根**——任何失败都安全留在旧目录，可幂等重试（已复制且大小一致的文件会跳过）。
            - 旧数据删除是独立动作，需要你明确确认后才执行，且保留数据根标记文件。

            ### 工程改进
            - 正式发版耗时从约 31 分钟降到约 15 分钟：修复了 tag 构建无法写入缓存的问题（此前每次都是全量冷编译），并将 macOS Intel 改为在 arm64 机器上交叉编译（原先的 Intel 机器单机就占 28 分钟）。
            - 新增手动快速构建通道（Actions → Quick platform build）：可单独构建 Windows / macOS arm64 / macOS Intel，约 8-12 分钟，**不打 tag、不改版本号、不创建 Release**，用于快速验证修复。

            ### 启动诊断能力（v0.1.37 起，持续保留）
            - boot log（Windows `%LOCALAPPDATA%\com.desic.terminal\logs\boot.log`）、panic 位置与 backtrace、致命失败的原生错误对话框；启动全过程按检查点记录，并打印解析出的实际目录。

            ### 市场雷达与研究基础
            - 市场雷达评分只用于研究优先级，不是收益预测、交易信号、策略入场条件或订单命令。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
