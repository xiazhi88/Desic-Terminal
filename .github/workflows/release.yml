name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        run: npm run smoke:ai-packaged-ready

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          releaseBody: |
            此版本未使用 Apple Developer ID 或 Windows Authenticode 签名。请只从本仓库的 GitHub Releases 下载；macOS 首次启动时需要手动允许打开，Windows 可能显示 SmartScreen 提示。
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
