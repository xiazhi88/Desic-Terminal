name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            platform: macos-15-intel
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          # 每次发版必须同步更新本段：releaseBody 不会自动跟随版本号。
          # 历史问题：v0.1.36 发版时此处仍为 v0.1.35 文案，导致该 Release 说明与产物不符。
          releaseBody: |
            ## Desic Terminal v0.1.37

            ### 启动诊断（定位“安装后一启动就闪退”）
            - 新增 boot log：在 Tauri 初始化之前建立独立日志，按检查点记录启动全过程（运行时目录 → splash 查找/显示 → 数据库初始化 → 进入事件循环 → 退出）。Windows 位于 `%LOCALAPPDATA%\com.desic.terminal\logs\boot.log`，macOS 位于 `~/Library/Logs/com.desic.terminal/boot.log`。
            - 新增 panic 捕获：任何启动期 panic 会写入位置与 backtrace，不再只留在无人可见的 stderr。
            - 构建或 setup 致命失败时，Windows 上弹出原生错误对话框并指向上述日志，替代此前的“静默闪退”。
            - splash 尺寸适配失败改为非致命（无显示器或远程会话场景不再阻断启动）。
            - 已知问题：干净 Windows 机器上的 v0.1.36 首发包存在启动即退出（退出码 101）。已排除 WebView2 缺失、VC++ 运行库缺失与安装不完整；若复现请提供 `boot.log` 以便定位。

            ### AI 研究 tab 重构为研究指挥舱
            - 工作区自包含化为 `src/ui/ai-research/` 模块并收敛为五层语义 CSS，三套并存紫色统一到单一品牌紫 token 契约。
            - 消息元数据纪律：时间/耗时/TTFT/吞吐/token/状态合并为单行；复制、分支、重试等次要操作改为悬停或键盘聚焦时显现。
            - 过程可视化：执行过程按真实工具状态渲染分段进度条（不虚构阶段标签）；高频工具结果改为结构化键值卡，支持切换“原始载荷”；简单的只读工具（行情快照/资金费率/合约规格）直接在消息结尾渲染内联证据卡，不再占用右侧面板。
            - 流式生命感：流式答案末尾品牌紫光标、运行中消息侧脊与头部状态点呼吸（失败转红），全部仅透明度/位移且支持 reduced-motion。
            - 证据甲板：卡片描边与悬停体系、市场图仪表卡、虚线空态引导；技术指标/K 线/盘口/情绪图补齐十字线与逐序列数值 tooltip、图例联动、最新值徽标；技术指标由共享值域改为每序列独立归一化，修复量纲差异导致的曲线压平。
            - 修复多周期 K 线读取：`bars.<周期>` 嵌套返回此前解析不到，导致“已读取 N 个周期”与“单点快照”自相矛盾；现按防御性多形状解析并让图表、计数与副标题同源派生。
            - 新会话任务甲板：默认在欢迎语下显示可直发的快捷建议（点击经同一提交路径发送），采用单轴居中构图、静默灰阶、悬停才出现强调色。
            - slash 命令参数化：`/market`、`/structure`、`/flow`、`/compare` 支持 symbol/timeframe 参数，命令面板显示参数提示，回车按顺序回填占位符。
            - 聚焦模式：一键收起会话栏与研究栏，主区满宽，默认网格零改动。

            ### AI 交互与正确性
            - 修复中文加粗不生效：`**事实：**最新报价` 这类闭合标记后紧跟汉字的写法此前会原样显示星号，现按 CJK 规则正确解析（历史消息同样受益）。
            - 对话偏好记忆：在输入区选择的模型、思考深度与权限会跨重启保留，下次打开与新建会话自动沿用；失效模型 id 自动回退默认。
            - 每轮输入的 token 成本透明化：消息 meta 行分示“输入 X · 输出 Y”，缺失时回退总数。
            - AI 工具面瘦身：压缩工具描述与属性描述措辞（行为契约逐条保留），剥离 description 后工具 schema 与行为等价。

            ### 行情与资产图标
            - 市场图标下载与读取从“仅接受 PNG 且文件存在即跳过”升级为按魔数识别 PNG/WebP/AVIF/JPEG/GIF 并输出真实 mime；缓存若为损坏内容（如误存的 HTML 错误页）会被清除并重新下载，不再永久卡在首字母占位。

            ### 市场雷达与研究基础
            - 保留全市场综合排名、强势、异动、活跃、稳健等研究视图；紧凑 inspector 榜单采用等宽行和细评分轨道，避免窄面板中的大块灰色卡片。
            - 市场雷达评分只用于研究优先级，不是收益预测、交易信号、策略入场条件或订单命令。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
