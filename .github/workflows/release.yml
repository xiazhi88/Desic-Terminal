name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            # 交叉编译：在 arm64 runner 上产出 x86_64 包。原来的 macos-15-intel 机器每次冷编译约 28 分钟，
            # 且因为 workflow 只由 tag 触发、save-if 排除了 tag，缓存永远无法写入 → 每次都是全量编译。
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
            # arm64 runner 默认没有 Rosetta，无法运行交叉编译出的 x64 包做运行时校验
            verify_packaged_sidecar: false
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        if: ${{ matrix.verify_packaged_sidecar != false }}
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          # 只有 __VERSION__ 占位会自动替换（tagName / releaseName / releaseBody 三处）；
          # releaseBody 里的其余人工正文不会跟随版本号，每次发版必须逐句核对。
          # 历史事故：v0.1.36 发版时说明文案仍是 v0.1.35 —— 本行保留作为警示。
          releaseBody: |
            ## Desic Terminal v__VERSION__

            本版两件事：一是**稳定性**，找到并修掉了卡顿、行情断流、数据库变慢的根因；二是**视觉改造**，交易、市场雷达、AI 研究、AI 自动化和策略研究都换上了新的可视化。

            ### 修复：界面卡顿与行情断流
            - **现象**：界面偶发卡死（macOS 彩球）；所有行情连接的「最近数据」同时涨到 60–90 秒且不自动重连；频繁出现 `database is locked`；图表 K 线读取超时。
            - **根因一（数据库慢）**：市场雷达研究分查询每次都会对整张 K 线表（数百万行）临时建索引，单次约 75 秒。执行期间一直占着数据库，WAL 文件无法回写、持续膨胀，所有其它读写都在排队。现在固定按主键查询，耗时降到 0.2 秒以内，并加了回归测试。
            - **根因二（线程被占满）**：读写数据库的命令原本在主线程或异步运行时的线程上等待，数据库一慢，界面和行情连接就一起停住。现在：
              - 数据库命令全部改到后台线程执行；写入按提交顺序依次执行。
              - 行情与账户推送连接改用专用线程，不再受命令拖累，断线重连也不会再被卡住。
              - 订单落库、价格提醒移出了行情读取循环。
            - **写入冲突**：所有写事务改为一开始就加写锁，不再在"先读后写"时立即报 `database is locked`。

            ### 修复：Python 研究环境在部分 Mac 上安装失败
            - **现象**：报「Timed out while trying to verify the local Python environment」，并提示检查 Python 安装是否损坏。
            - **根因**：依赖装完后，首次加载 numpy / pandas / scikit-learn 只给了 12 秒。在开启 Gatekeeper 或装了安全软件的 Mac 上，系统会逐个扫描两百多个新安装的原生库，常常超过这个时间。这不是本机 Python 的问题。
            - **修复**：
              - 改为按进度判定：逐个模块加载，只要持续推进就继续等；单个模块 120 秒没有进展才判定失败。
              - 超时后结束进程并自动重试一次。
              - 界面显示正在首次加载哪个库；每个模块的耗时和卡住的位置都会写入 `setup.log`。

            ### 修复：老用户每次启动仍弹出「选择数据存放位置」
            - v0.2.4 修正了"是否需要选择"的判定，但启动页在准备工作目录的几秒里仍会对所有人显示这张选择卡片。现在只有首次启动或准备失败时才会显示。

            ### 新功能：订单流模式（替代流动性热力图）
            - **成交量分布**：由本地 1 分钟 K 线计算，含 POC 和价值区；阳线、阴线成交分开显示；固定取最近 300 根，缩放时不会跳动。
            - **主动买卖差 / CVD 副图**：主图底部有买卖力量色带，并标注价格与 CVD 的背离。
            - **当前大单墙**：显示挂单量与已挂时长；挂单量明显减少时会提示。清算以光斑标记。
            - **深度剖面**：鼠标悬停显示档位价格、挂单量、累计深度和离中间价的距离；点击可把该价位填入委托价。
            - **弹出图表**：每个图表格可以单独开启订单流；某一项数据暂时不可用时，不会再让整格显示「加载失败」。

            ### 新视觉
            - **磷光外观**：冷色信号蓝作为唯一强调色，紫色只保留给 AI 相关区域，只有实时数据会发光；价格数字滚动更新。
            - **市场星图**：全市场散点星图，支持轮动回放。
            - **证据天平**：AI 研究过程中证据实时入账，天平随之落定。
            - **值守心电图**（AI 自动化）：每个 Profile 一条时间泳道，每次运行显示为一个脉冲，能直接看出唤醒节奏、跳过和升级、执行了哪些动作；可按时间范围查看，不再只有最近 50 条。
            - **参数地形图**（策略研究）：按参数空间展示验证集表现，叠加过拟合层和邻域稳健度，区分"窄尖峰"和"稳健高原"。
            - **回放剧场**（策略研究）：价格、交易、权益、回撤、保证金占用五条轨道共用一个播放头；播放时浮出策略的决策理由；最高 4K 根/秒；回测记录收进可展开的抽屉。

            ### 验证情况与已知残余风险
            - **已通过**：
              - Rust：`cargo test --lib`（645 项）、`cargo check --workspace`；
              - 前端与校验：`npm run build`、`test:i18n`、`test:ai-policy`、`test:systematic-python`（使用内置运行时）、`smoke:config-security`；
              - 冒烟测试：图表、AI 研究、AI 自动化、策略研究（常规与一个月数据）、启动页。
            - **未完全验证**：多数新可视化只在预览环境和自动化测试中验证过，尚未在桌面端用真实行情长时间观察。
            - **待确认**：Python 环境的修复要在最初报告问题的那台 Mac 上最终确认；如仍失败，`setup.log` 会记录具体卡在哪个模块。
            - **已知限制**：应用仍为 ad-hoc 签名、未经 Apple 公证，首次打开时系统可能提示无法验证开发者。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
