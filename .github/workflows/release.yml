name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            platform: macos-15-intel
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          # 每次发版必须同步更新本段：releaseBody 不会自动跟随版本号。
          # 历史问题：v0.1.36 发版时此处仍为 v0.1.35 文案，导致该 Release 说明与产物不符。
          # 每次发版必须同步更新本段：releaseBody 不会自动跟随版本号。
          # 历史问题：v0.1.36 发版时此处仍为 v0.1.35 文案，导致该 Release 说明与产物不符。
          releaseBody: |
            ## Desic Terminal v0.1.38

            ### 修复：首次安装后一启动就退出（退出码 101）
            - 症状：干净 Windows 机器安装后双击启动，进程在 splash 出现前直接消失；系统事件查看器无崩溃记录（Rust panic 不是崩溃），命令行无输出（GUI 进程无控制台），应用日志为空。
            - 根因：启动时运行目录初始化流程中，「旧标识目录迁移 / 旧工作区配置迁移 / 内置 Skill 包安装」返回的**裸 io 错误**被当作致命错误上抛——Windows 干净安装命中后即退出。v0.1.37 新增的 boot log 精确定位到：`setup: begin` 之后、`FATAL: 应用运行目录初始化失败: 系统找不到指定的路径。(os error 3)`。
            - 修复：上述三个步骤全部改为**尽力而为**——失败只写入 boot.log（AI 场景按降级处理），不再阻断启动；关键目录创建失败仍保持致命。
            - 诊断增强：boot.log 输出解析出的实际路径（`paths: config=… cache=… log=… data=…`），并为每一步补充精确上下文（解析各目录失败、`icacls` 运行失败均带路径）。

            ### 启动诊断能力（v0.1.37 起）
            - boot log：在 Tauri 初始化之前建立独立日志，按检查点记录启动全过程。Windows 位于 `%LOCALAPPDATA%\com.desic.terminal\logs\boot.log`，macOS 位于 `~/Library/Logs/com.desic.terminal/boot.log`。
            - panic 捕获：写入位置与 backtrace，不再只留在无人可见的 stderr。
            - 构建或 setup 致命失败时，Windows 弹出原生错误对话框并指向上述日志，替代“静默闪退”。
            - splash 尺寸适配失败改为非致命（无显示器或远程会话场景）。

            ### 自 v0.1.36 起的其它内容
            - AI 研究 tab 重构为研究指挥舱：过程分段进度条、工具结果结构化键值卡、简单工具内联证据卡、流式光标与状态点、证据甲板图表交互（十字线/数值 tooltip/独立归一化）、多周期 K 线解析修复、任务甲板快捷建议、slash 命令参数化、聚焦模式。
            - AI 交互与正确性：修复中文加粗不生效；对话偏好（模型/思考深度/权限）跨重启记忆；输入/输出 token 分示；AI 工具面文本瘦身（行为契约逐条保留）。
            - 市场资产图标：按魔数识别 PNG/WebP/AVIF/JPEG/GIF，损坏缓存自动清除重下，不再永久停留在首字母占位。

            ### 市场雷达与研究基础
            - 保留全市场综合排名、强势、异动、活跃、稳健等研究视图；紧凑 inspector 榜单采用等宽行和细评分轨道。
            - 市场雷达评分只用于研究优先级，不是收益预测、交易信号、策略入场条件或订单命令。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
