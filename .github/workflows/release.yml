name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            # 交叉编译：在 arm64 runner 上产出 x86_64 包。原来的 macos-15-intel 机器每次冷编译约 28 分钟，
            # 且因为 workflow 只由 tag 触发、save-if 排除了 tag，缓存永远无法写入 → 每次都是全量编译。
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
            # arm64 runner 默认没有 Rosetta，无法运行交叉编译出的 x64 包做运行时校验
            verify_packaged_sidecar: false
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        if: ${{ matrix.verify_packaged_sidecar != false }}
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          # 每次发版必须同步更新本段：releaseBody 不会自动跟随版本号。
          # 历史问题：v0.1.36 发版时此处仍为 v0.1.35 文案，导致该 Release 说明与产物不符。
          # 每次发版必须同步更新本段：releaseBody 不会自动跟随版本号。
          # 历史问题：v0.1.36 发版时此处仍为 v0.1.35 文案，导致该 Release 说明与产物不符。
          # 每次发版必须同步更新本段：releaseBody 不会自动跟随版本号。
          releaseBody: |
            ## Desic Terminal v0.1.39

            ### 修复：Windows 首次安装后“内置 Skill 安装失败”及其连锁问题
            - 定位：v0.1.38 的 boot log 在 Windows 报出唯一失败点 `builtin skill bundles install failed: 系统找不到指定的路径。(os error 3)`。
            - 影响面（同一个根因）：① v0.1.38 之前表现为启动即退出（退出码 101）② 内置 Skill 缺失 ③ AI 自动化面板报 `ai_automation_summary / ai_automation_overview` 失败（同一个 os error 3）。根因是 `ensure_skill_versions()` 首行即调用该安装函数并以 `?` 上抛。
            - 修复：安装链每一处错误补齐“操作 + 完整路径”上下文；Windows 文件替换增加降级链（`MoveFileExW` 带/不带 WRITE_THROUGH → 复制+删除），兼容 AppData 被重定向到网络位置等场景；`ensure_skill_versions` 的 Skill 相关步骤改为尽力而为——失败只写 boot.log，不再让 AI 自动化面板整体不可用。
            - 若仍复现，boot.log 会直接打印失败的操作与路径（例如 `创建 Skill bundle 父目录 <路径> 失败: …`）。

            ### 启动诊断能力（v0.1.37 起）
            - boot log：Tauri 初始化前独立落盘。Windows `%LOCALAPPDATA%\com.desic.terminal\logs\boot.log`，macOS `~/Library/Logs/com.desic.terminal/boot.log`；启动全程按检查点记录，并打印解析出的 config/cache/log/data 实际路径。
            - panic 捕获（位置 + backtrace）与 Windows 原生错误对话框，替代“静默闪退”。

            ### 自 v0.1.36 起的其它内容
            - AI 研究 tab 重构为研究指挥舱（过程可视化、结构化工具卡、内联证据卡、证据甲板图表交互、任务甲板、slash 参数化、聚焦模式）。
            - 中文加粗修复；对话偏好（模型/思考深度/权限）跨重启记忆；输入/输出 token 分示；AI 工具面文本瘦身。
            - 市场资产图标缓存自愈（魔数识别 PNG/WebP/AVIF/JPEG/GIF，损坏缓存自动重下）。

            ### 市场雷达与研究基础
            - 市场雷达评分只用于研究优先级，不是收益预测、交易信号、策略入场条件或订单命令。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
