name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            # 交叉编译：在 arm64 runner 上产出 x86_64 包。原来的 macos-15-intel 机器每次冷编译约 28 分钟，
            # 且因为 workflow 只由 tag 触发、save-if 排除了 tag，缓存永远无法写入 → 每次都是全量编译。
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
            # arm64 runner 默认没有 Rosetta，无法运行交叉编译出的 x64 包做运行时校验
            verify_packaged_sidecar: false
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        if: ${{ matrix.verify_packaged_sidecar != false }}
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          # 只有 __VERSION__ 占位会自动替换（tagName / releaseName / releaseBody 三处）；
          # releaseBody 里的其余人工正文不会跟随版本号，每次发版必须逐句核对。
          # 历史事故：v0.1.36 发版时说明文案仍是 v0.1.35 —— 本行保留作为警示。
          releaseBody: |
            ## Desic Terminal v__VERSION__

            本版带来两块功能改进：AI 模型配置更完整（可拉取模型列表、可编辑上下文窗口与 Provider），下单面板支持按成本（USDT）输入数量。

            ### 新增：AI 模型配置可拉取模型列表、可编辑上下文窗口与 Provider
            - 已保存的模型配置现在可以直接修改 **Provider**（协议下拉，默认常用项、可展开全部、支持自定义输入）与 **contextWindow**，不必删除重建。
            - 内置与自定义供应商均支持**拉取最新模型列表**（直连 `{baseUrl}/models`，按供应商协议自动选择 Bearer / x-api-key / x-goog-api-key 认证头，走系统代理设置）；自定义供应商填完 Base URL 与 API Key 即可拉取。
            - 内置供应商为已知模型**预填默认上下文窗口**：与运行时使用的 @cline/llms 目录一致的受同步测试约束，目录未收录的取自厂商官方文档，无可靠来源的留空待填。
            - 修正 deepseek-v4-flash 上下文：DeepSeek 官方口径 V4 全系 1M，但上游 @cline/llms 目录仍标 128000。sidecar 新增"已知上游错误"覆盖表（查目录前先生效），该模型现在按 1,000,000 tokens 运行；**已保存配置中残留 128000 的用户请清空该字段或手动改为 1000000**。

            ### 新增：下单面板支持按成本（USDT）输入
            - 开仓数量输入新增**张 / 成本**切换：成本模式下输入 USDT 成本，按 `成本 = 名义价值 × (1/杠杆 + 费率)` 反解张数并按合约步进向下取整，输入框下方实时显示"约等于 X 张（含手续费估算）"。
            - 百分比按钮在成本模式下按可用余额比例填充；离焦时超出可用余额会自动封顶为最大可用。
            - 成本模式的估算行显示**预计成本（含手续费）**，与张模式的"预计占用保证金"区分——输入 5 USDT 显示 ≈4.64 时，差额来自合约步进取整，零头不进入仓位。
            - 平仓模式保持张数输入不变；不提供 USDT 名义价值与币数量两种输入。

            ### 验证情况与已知残余风险
            - 通过 `cargo check --workspace`、`cargo test --lib model_list`（5/5）、`npm run build`、`test:i18n`（10 locales）、AI 供应商目录同步测试与终端 UI 冒烟（含单位切换断言）。
            - 成本换算为本地估算（费率按市价 0.05% / 限价 0.02%，与既有预估口径一致），OKX 实际手续费因账户费率档位可能略有差异，界面已标注"含手续费估算"。
            - AI 模型列表拉取依赖供应商网关可达性；本机 CLI 类 Provider（claude-code、codex 等）没有 /models 端点，对这些 Provider 拉取会提示不支持。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
