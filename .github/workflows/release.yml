name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            platform: macos-15-intel
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          releaseBody: |
            ## Desic Terminal v0.1.35

            ### AI Research 工作区
            - AI Research 升级为默认顶层工作区，保留统一行情/账户头部、会话历史、队列、分支和完整的桌面会话持久化。
            - 新增 Graphite Violet 视觉系统：右侧研究 rail、研究时间线、工具状态、代码 surface 与 composer 统一层级；减少大面积绿色与装饰性发光，支持 reduced-motion。
            - 右侧 inspector 支持当前研究上下文、证据链、产物/执行分组、市场情报和紧凑 Market Radar；雷达条目可直接生成研究指令。
            - 策略创建结果展示 Python 源码、策略方案、协议/入口/版本信息，并提供只读 CodeMirror 预览和进入 Strategy Lab / 回测计划入口。
            - AI 回答保留底部引用证据列表，证据可打开对应资料，资料可反向定位引用它的回答。

            ### AI 可靠性与交互
            - Provider 瞬态网络失败采用最多 5 次重试、500ms 起步指数退避、10s 封顶和 10% 抖动；已有模型或工具进度后不重放整轮。
            - 正确区分用户主动停止、空闲超时、Provider 重连和具体服务错误；`session_stop` 不再误报为未处理 AI 运行错误。
            - 修复 `Reconnecting... 1/5` 绕过重试策略的问题，并补充可读错误说明。
            - composer 发送/停止控制移到输入框右侧，工具行默认只显示领域图标、工具名称和概览，耗时与诊断按需显示。

            ### 市场雷达与研究基础
            - 保留全市场综合排名、强势、异动、活跃、稳健等研究视图；紧凑 inspector 榜单采用等宽行和细评分轨道，避免窄面板中的大块灰色卡片。
            - 市场雷达评分只用于研究优先级，不是收益预测、交易信号、策略入场条件或订单命令。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
