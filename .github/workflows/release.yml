name: Release desktop application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            rust_cache_key: macos-arm64-release
            cache_workspace_crates: false
            args: --target aarch64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: arm64
            asset_name: Desic-Terminal_macOS-arm64.[ext]
            apple_signing_identity: "-"
          - name: macOS Intel
            # 交叉编译：在 arm64 runner 上产出 x86_64 包。原来的 macos-15-intel 机器每次冷编译约 28 分钟，
            # 且因为 workflow 只由 tag 触发、save-if 排除了 tag，缓存永远无法写入 → 每次都是全量编译。
            platform: macos-latest
            rust_targets: x86_64-apple-darwin
            rust_cache_key: macos-x64-release
            cache_workspace_crates: false
            args: --target x86_64-apple-darwin --bundles app,dmg
            sidecar_platform: darwin
            sidecar_arch: x64
            asset_name: Desic-Terminal_macOS-x64.[ext]
            apple_signing_identity: "-"
            # arm64 runner 默认没有 Rosetta，无法运行交叉编译出的 x64 包做运行时校验
            verify_packaged_sidecar: false
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            rust_cache_key: windows-x64-tauri-release-v1
            cache_workspace_crates: true
            args: --target x86_64-pc-windows-msvc --bundles nsis
            sidecar_platform: win32
            sidecar_arch: x64
            asset_name: Desic-Terminal_Windows-x64-setup.[ext]
            apple_signing_identity: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.rust_cache_key }}
          cache-workspace-crates: ${{ matrix.cache_workspace_crates }}
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: npm run test:release-version

      - name: Prepare AI sidecar for runtime verification
        run: npm run prepare:sidecar
        env:
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}

      - name: Verify packaged AI sidecar runtime
        if: ${{ matrix.verify_packaged_sidecar != false }}
        run: npm run smoke:ai-packaged-ready

      - name: Cache bundled Python runtime
        uses: actions/cache@v4
        with:
          path: cache/systematic-python-runtime
          key: systematic-python-${{ matrix.sidecar_platform }}-${{ matrix.sidecar_arch }}-3.13.15-20260814

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          DESIC_SIDECAR_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SIDECAR_TARGET_ARCH: ${{ matrix.sidecar_arch }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_PLATFORM: ${{ matrix.sidecar_platform }}
          DESIC_SYSTEMATIC_PYTHON_TARGET_ARCH: ${{ matrix.sidecar_arch }}
        with:
          tagName: v__VERSION__
          releaseName: Desic Terminal v__VERSION__
          # 只有 __VERSION__ 占位会自动替换（tagName / releaseName / releaseBody 三处）；
          # releaseBody 里的其余人工正文不会跟随版本号，每次发版必须逐句核对。
          # 历史事故：v0.1.36 发版时说明文案仍是 v0.1.35 —— 本行保留作为警示。
          releaseBody: |
            ## Desic Terminal v__VERSION__

            本版聚焦「启动与运行环境的可靠性」：修掉三处会卡住或误报的缺陷，并显著加快启动动画里的「正在准备交易对资源」。

            ### 修复：数据目录迁移在 98% 必然失败（Windows）
            - **现象**：迁移到新盘时报「另一个程序正在使用此文件，进程无法访问。(os error 32)」，复制到 98% 失败，重试永远失败。
            - **根因**：`EBWebView`（WebView2 的用户数据目录）恰好位于应用缓存目录内，其中 `Cookies`、`Login Data` 等文件被运行中的 `msedgewebview2.exe` 独占锁定；而迁移正是由 splash 里的 WebView2 触发的，锁从启动起就存在。更关键的是：迁移后 Tauri 仍使用默认位置的 EBWebView，这份拷贝是死数据——复制它既危险又无用。
            - **修复**：迁移计划按绝对路径前缀排除 `EBWebView`；缓存通道内被占用的文件改为**跳过并计数**（缓存内容均可重建），config / data / logs 三个通道仍保持严格失败；清理旧数据时跳过仍是活的 EBWebView；用量统计不再把 EBWebView 计入。迁移向导会提示「有 N 个缓存文件因被占用被跳过（可重建，不影响使用）」。

            ### 修复：非首次启动仍弹出「选择数据存放位置」
            - 旧判定靠「数据库 / 配置文件是否存在」推断，`data-dir.json` 丢失时会把老用户误判成首次，弹框且面对一个空库。
            - 新增持久化完成标记 `bootstrap-done.json`（与 `data-dir.json` 同目录，不随数据迁移）；老用户即使标记缺失，只要发现任何既有数据就判为老用户并补写标记——正常升级用户不会再看到该弹框。

            ### 改进：Python 研究环境（装得快、卡在哪看得见、失败有据可查）
            - **pip 现在走应用代理**：此前安装依赖的子进程完全不使用应用代理，需要代理的网络下三个镜像会各等满 180 秒再报「环境未就绪」，且界面上没有任何细节。实测走代理后清华镜像 17 秒装完全部依赖。
            - **实时进度**：安装过程逐行输出 pip 日志，界面显示当前阶段、第 N/3 个镜像、已用时间与最新一行输出；并补上「正在校验 Python 依赖」「正在完成安装」两个此前完全静默的收尾阶段。
            - **失败可追溯**：完整安装转录写入 `<数据目录>/systematic-python/setup.log`；失败原因与日志路径直接显示在策略研究面板（不再只在特定标签页可见），并落盘 `setup-failure.json`——点「重新检测」不会再把上次的错误抹掉。
            - **收尾竞态修复**：安装成功后界面可能永远停在「正在安装」，现在完成即收尾。

            ### 改进：启动时不再重拉交易对资源
            - 合约列表缓存增加 6 小时新鲜期：期内启动直接复用缓存，不再联网重拉 `/instruments` 并重写缓存。
            - icon 只下载缺失的，且失败币种的退避窗口**真正生效**（此前退避字段写了但从不读取，导致 CDN 上不存在的 icon 每次启动都重试 3 次，拖慢启动）。

            ### 修复：AI 已完整回答却被标记「AI 运行错误」
            - **现象**：一轮对话已返回完整研判正文，但侧栏与消息上显示失败，红框里甚至装着整段回答。
            - **根因**：provider 在给出完整回答后仍以 `finishReason: error` 收尾时，旧逻辑直接判定硬失败；错误文案的兜底又回退到正文，于是回答本身被当成错误信息，落库状态也是 failed。
            - **修复**：只要有完整回答就以回答为准——正常投递、按 completed 记账，收尾错误降级为一条提示并写入日志；前端也不再拿正文当失败文案，历史里这类消息不再显示错误横幅。

            ### 验证情况与已知残余风险
            - 通过 `cargo check --workspace`、`cargo test --lib`（628 项）、`npm run build`、`test:i18n`（10 locales）、`test:ai-stream`、`smoke:config-security` 与终端 UI 冒烟。
            - 新增单测：迁移计划排除 EBWebView / 缓存跳过计数 / 用量与清理排除（3 项）、首启判定五种情形（5 项）、Python 代理注入与日志清洗 / 失败记录往返 / 流式超时（5 项）、合约缓存新鲜期与 icon 退避（2 项）、AI 收尾判定（1 项）。
            - **未在 Windows 真机跑过一次「带活着的 WebView2 的迁移」**（开发机为 macOS，迁移仅 Windows 生效），排除与跳过逻辑由单测覆盖。
            - Python 代理注入只支持 HTTP / HTTPS：SOCKS 需要 PySocks，而它正是待安装的依赖之一，导出 SOCKS 会把可直连的场景变成必然失败。
            - 若此前已把数据目录迁移到新盘并留下 `<新根>/cache/EBWebView` 死拷贝，本版不会自动清理（不会被读取、也不计入统计，仅占磁盘）。
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          releaseAssetNamePattern: ${{ matrix.asset_name }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
