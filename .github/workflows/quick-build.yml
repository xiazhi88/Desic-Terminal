name: Quick platform build

# 手动触发的快速构建：用于验证修复，**不创建/覆盖 GitHub Release、不动版本号**。
# 目的：把「改代码 → 拿到安装包」的回路从正式发版的十几分钟压到单平台约 8-12 分钟。
# 正式发版仍走 release.yml（打 v* tag，三平台 + 自动发布 + 更新清单）。
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "构建平台"
        type: choice
        options:
          - windows-x64
          - macos-arm64
          - macos-intel-cross
          - all
        default: windows-x64

permissions:
  contents: read

jobs:
  windows:
    if: ${{ inputs.platform == 'windows-x64' || inputs.platform == 'all' }}
    uses: ./.github/workflows/build-platform.yml
    with:
      name: Windows x64
      runner: windows-latest
      rust_targets: x86_64-pc-windows-msvc
      rust_cache_key: windows-x64-tauri-release-v1
      cache_workspace_crates: true
      args: --target x86_64-pc-windows-msvc --bundles nsis
      sidecar_platform: win32
      sidecar_arch: x64
      artifact_name: Desic-Terminal_Windows-x64-setup
      artifact_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
    secrets: inherit

  macos-arm64:
    if: ${{ inputs.platform == 'macos-arm64' || inputs.platform == 'all' }}
    uses: ./.github/workflows/build-platform.yml
    with:
      name: macOS Apple Silicon
      runner: macos-latest
      rust_targets: aarch64-apple-darwin
      rust_cache_key: macos-arm64-release
      args: --target aarch64-apple-darwin --bundles app,dmg
      sidecar_platform: darwin
      sidecar_arch: arm64
      apple_signing_identity: "-"
      artifact_name: Desic-Terminal_macOS-arm64
      artifact_path: |
        src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
        src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
    secrets: inherit

  macos-intel-cross:
    if: ${{ inputs.platform == 'macos-intel-cross' || inputs.platform == 'all' }}
    uses: ./.github/workflows/build-platform.yml
    with:
      name: macOS Intel (cross)
      runner: macos-latest
      rust_targets: x86_64-apple-darwin
      rust_cache_key: macos-x64-release
      args: --target x86_64-apple-darwin --bundles app,dmg
      sidecar_platform: darwin
      sidecar_arch: x64
      apple_signing_identity: "-"
      artifact_name: Desic-Terminal_macOS-x64
      artifact_path: |
        src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
        src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
    secrets: inherit
