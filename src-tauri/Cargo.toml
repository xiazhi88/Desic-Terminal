[package]
name = "desic-terminal"
version = "0.1.30"
description = "Desic Terminal desktop trading application"
authors = ["Desic Terminal"]
license = "MIT"
repository = "https://github.com/xiazhi88/Desic-Terminal"
edition = "2021"
rust-version = "1.77"
default-run = "desic-terminal"
autobins = false

[workspace]
default-members = ["."]
members = [
  "crates/agent-automation",
  "crates/chart-dsl",
  "crates/intelligence",
  "crates/private-history",
  "crates/systematic",
  "crates/smoke-tools",
  "crates/storage-config",
  "crates/trade-domain",
]

[lib]
name = "desic_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "desic-terminal"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "socks"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tokio-native-tls = "0.3"
native-tls = "0.2"
rusqlite = { version = "0.33", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
crc32fast = "1.4"
flate2 = "1.1"
tar = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
csv = "1.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
aes-gcm = "0.10"
rand = "0.8"
semver = "1"
desic-private-history = { path = "crates/private-history" }
desic-agent-automation = { path = "crates/agent-automation" }
desic-storage-config = { path = "crates/storage-config" }
desic-trade-domain = { path = "crates/trade-domain" }
desic-chart-dsl = { path = "crates/chart-dsl" }
desic-intelligence = { path = "crates/intelligence" }
desic-systematic = { path = "crates/systematic" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.dev]
debug = 0
incremental = true
codegen-units = 256

[profile.dev.build-override]
debug = 0
codegen-units = 256
